tax_pipeline_profile:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth  # Uses the 'gcloud auth application-default login' you did earlier
      project: <YOUR_PROJECT_ID>     # <-- Replace - Click your Project. Copy the ID
      dataset: tax_pipeline_db      
      threads: 4
      timeout_seconds: 300
      location: us                   
      priority: interactive
